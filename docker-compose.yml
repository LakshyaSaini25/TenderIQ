version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: tendermate-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h

volumes:
  ollama_data:
    name: tendermate_ollama_data

